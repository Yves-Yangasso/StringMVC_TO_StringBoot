name: Build et push de l'image Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:          # on construit sans publier, pour valider la PR
  workflow_dispatch:     # bouton "Run workflow" dans l'onglet Actions

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparer Buildx
        uses: docker/setup-buildx-action@v3

      # Sur une pull request on ne publie pas : pas besoin des identifiants
      - name: Connexion a Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Calcule les tags : latest sur main, le SHA court a chaque push,
      # et le numero de version quand un tag git v1.2.3 est pousse
      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bao236/stringmvc_to_stringboot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Recapitulatif
        if: github.event_name != 'pull_request'
        run: |
          echo "### Image publiee" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
