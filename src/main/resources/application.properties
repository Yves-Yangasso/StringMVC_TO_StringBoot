spring.application.name=StringMVC_TO_StringBoot
server.port=8080

# Base de donnees (identique au projet Spring MVC)
spring.datasource.url=jdbc:postgresql://localhost:5433/diti4_spring_mvc
spring.datasource.username=postgres
spring.datasource.password=gnay

# Le schema est gere par Flyway : Hibernate se contente de le verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway : scripts dans src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Base deja existante : on pose un baseline en V1 au lieu d'echouer
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
